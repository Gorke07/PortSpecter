name: Rust checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libdbus-1-dev iproute2 iputils-ping
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p portspecter-desktop --locked
      - run: python scripts/package.py --check
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s sh packaging/linux/portspecter-packet-access packaging/macos/packet-access packaging/macos/preinstall packaging/macos/postinstall
      - if: runner.os != 'Windows'
        run: python scripts/package.py --binary target/debug/portspecter
      - if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: development-package-${{ matrix.os }}
          path: artifacts/packages/*
          if-no-files-found: error
