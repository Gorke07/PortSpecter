name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check tag matches the workspace version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, re, tomllib; tag = os.environ["RELEASE_TAG"]; version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) and tag == "v" + version, f"Tag {tag} must match workspace version {version}"'
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release executable
        run: cargo build --release --locked -p portspecter-desktop
      - name: Build Windows archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force artifacts/packages, artifacts/windows | Out-Null
          Copy-Item target/release/portspecter.exe, LICENSE, NOTICE, README.md, README.tr.md artifacts/windows/
          Compress-Archive -Path artifacts/windows/* -DestinationPath "artifacts/packages/PortSpecter-$env:RELEASE_TAG-windows-x64-portable.zip"
      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=$version" "/O$pwd\artifacts\packages" "/FPortSpecter-$env:RELEASE_TAG-windows-x64-setup" packaging/windows/portspecter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test installer and uninstaller
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = "$pwd\artifacts\packages\PortSpecter-$env:RELEASE_TAG-windows-x64-setup.exe"
          $destination = Join-Path $env:RUNNER_TEMP 'portspecter-install-test'
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0 -or !(Test-Path "$destination\portspecter.exe") -or !(Test-Path "$destination\unins000.exe")) { throw 'Installer smoke test failed' }
          $uninstall = Start-Process -FilePath "$destination\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$destination\portspecter.exe")) { throw 'Uninstaller smoke test failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-windows
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package-windows
          path: dist
      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File | Sort-Object Name)
          if ($files.Count -ne 2) { throw "Expected installer and portable archive, got $($files.Count) files" }
          $checksums = foreach ($file in $files) { "$( (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant() )  $($file.Name)" }
          Set-Content -Path dist/SHA256SUMS.txt -Value $checksums -Encoding utf8
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --notes-file .github/release-notes.md
