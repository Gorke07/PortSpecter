[package]
name = "portspecter-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "portspecter"

[[bin]]
name = "portspecter"
path = "src/main.rs"

[dependencies]
portspecter-domain.workspace = true
portspecter-core.workspace = true
portspecter-platform.workspace = true
portspecter-storage.workspace = true
portspecter-probe.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
iced = { version = "=0.14.0", features = ["tokio", "svg", "advanced"] }
directories = "6"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"

[build-dependencies]
winresource = "0.1"
